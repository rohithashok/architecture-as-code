name: Build CALM Web Viewer
permissions:
    contents: read
on:
    pull_request:
        branches: ['main', 'release*']
        paths:
            [
                'calm-plugins/web/**',
                'package.json',
                'package-lock.json',
                '.github/workflows/build-web-viewer.yml',
            ]
    push:
        branches: ['main', 'release*']
        paths:
            [
                'calm-plugins/web/**',
                'package.json',
                'package-lock.json',
                '.github/workflows/build-web-viewer.yml',
            ]
    workflow_dispatch:
jobs:
    web-viewer:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
            - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
              with:
                  node-version-file: '.nvmrc'
            - name: Install web workspace
              run: npm ci --workspace calm-plugins/web --include-workspace-root --ignore-scripts
            - name: Validate lockfile platforms
              run: node scripts/validate-lockfile-platforms.js
            - name: Lint
              run: npm run lint --workspace calm-plugins/web
            - name: Unit tests and coverage
              run: npm test --workspace calm-plugins/web -- --coverage
            - name: Build
              run: npm run build:web
            - name: Check public declarations
              run: npm exec -- tsc --noEmit --skipLibCheck --lib ES2022,DOM calm-plugins/web/src/index.d.ts
            - name: Install Chromium
              run: npm exec --workspace calm-plugins/web -- playwright install --with-deps chromium
            - name: Browser tests
              run: npm run test:browser --workspace calm-plugins/web
